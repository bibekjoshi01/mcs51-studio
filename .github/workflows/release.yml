name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x64
          - runner: ubuntu-22.04
            target: linux-amd64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check release version
        shell: bash
        run: |
          python - <<'PY'
          import os, runpy
          version = runpy.run_path("src/mcs51_studio/metadata.py")["VERSION"]
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Tag must match package version"
          PY
      - name: Install Linux desktop build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb xauth
      - run: python -m pip install '.[build]'
      - run: python -m unittest discover -s tests -v
      - name: Linux desktop integration tests
        timeout-minutes: 8
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python -u tests/gui.py
          xvfb-run -a python -u tests/stress_gui.py
      - name: Windows/macOS desktop integration tests
        timeout-minutes: 8
        if: runner.os != 'Linux'
        run: |
          python -u tests/gui.py
          python -u tests/stress_gui.py
      - name: Build and smoke-test Linux installer
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/build_release.py
      - name: Build and smoke-test Windows/macOS installer
        if: runner.os != 'Linux'
        run: python scripts/build_release.py
      - name: Upload installer and checksum
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: release
          merge-multiple: true
      - name: Upload installers or create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="docs/release-notes/$GITHUB_REF_NAME.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          elif [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag \
              --title "MCS51 Studio $GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag --generate-notes
          fi
