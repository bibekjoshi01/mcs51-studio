name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m unittest discover -s tests -v
      - name: Install Linux GUI test libraries
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb xauth
      - name: Linux GUI smoke test
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: xvfb-run -a python -m mcs51_studio --smoke-test
      - name: Windows/macOS GUI smoke test
        if: runner.os != 'Linux' && matrix.python-version == '3.12'
        run: python -m mcs51_studio --smoke-test
