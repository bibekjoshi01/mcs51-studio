[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mcs51-studio"
dynamic = ["version"]
description = "Desktop assembly editor, debugger, and simulator for the 8051 microcontroller"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-MCS51-Studio-Educational"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/bibekjoshi01/mcs51-studio"
Issues = "https://github.com/bibekjoshi01/mcs51-studio/issues"

[project.optional-dependencies]
dev = ["ruff==0.17.2"]
build = ["pyinstaller==6.20.0"]
artwork = ["Pillow>=12,<13"]

[project.gui-scripts]
mcs51-studio = "mcs51_studio.ui.application:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "mcs51_studio.metadata.VERSION"}

[tool.setuptools.package-data]
mcs51_studio = ["data/*.json", "data/*.asm", "data/*.png"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E9", "F", "I"]
